<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Mighty Boosh - Journey Through the Zooniverse</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #05040c;
      overflow: hidden;
      font-family: monospace;
    }
    #wrap {
      position: absolute; top: 0; left: 0; right: 0; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 0 2px #1a1530, 0 0 40px rgba(120,90,220,0.25);
    }
    #boot {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #c79aff; font-size: 14px; letter-spacing: 2px;
      background: #05040c;
      z-index: 10;
    }
    #boot.hidden { display: none; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="boot">LOADING THE ZOONIVERSE...</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
