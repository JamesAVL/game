name: Deploy to GitHub Pages

# Builds the game with Vite (regenerates assets + validates zones first) and
# publishes the dist/ bundle to GitHub Pages.

on:
  push:
    branches:
      - "claude/mighty-boosh-game-kL5wh"
      - "main"
  workflow_dispatch: {}

# allow this workflow to publish Pages
permissions:
  contents: read
  pages: write
  id-token: write

# only one Pages deploy at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (regenerate assets, validate zones, bundle)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true        # turn Pages on via the API if it isn't already

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist               # the built bundle is the web root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
