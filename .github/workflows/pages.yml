name: Deploy to GitHub Pages

# Publishes the static game (index.html + src/ + assets/) to GitHub Pages.
# No build step — it's plain ES modules and generated PNGs served as-is.

on:
  push:
    branches:
      - "claude/mighty-boosh-game-kL5wh"
      - "main"
  workflow_dispatch: {}

# allow this workflow to publish Pages
permissions:
  contents: read
  pages: write
  id-token: write

# only one Pages deploy at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true        # turn Pages on via the API if it isn't already

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .                 # repo root is the web root

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
